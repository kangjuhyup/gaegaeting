name: gaegaeting
description: 개개팅 Flutter 클라이언트
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.6'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  dio: ^5.11.1
  retrofit: ^4.10.0
  json_annotation: ^4.12.0
  cupertino_icons: ^2.0.0
  flutter_svg: ^2.2.4
  auth_platform_flutter:
    git:
      url: https://github.com/kangjuhyup/auth.git
      ref: 88627841dddef17f04f55116b0b8e7969a7350ac
      path: sdks/flutter
  geolocator: ^14.0.2
  in_app_purchase: ^3.3.1
  in_app_purchase_android: ^0.5.3
  # 0.4.12+ uses a newer Xcode StoreKit API; retain Xcode 16.2 compatibility.
  in_app_purchase_storekit: 0.4.11+2
  flutter_secure_storage: ^10.3.4
  crypto: ^3.0.7
  flutter_map: 8.3.2
  latlong2: ^0.9.1
  image_picker: 1.2.3
  web_socket_channel: 3.0.3
  jose: 0.3.5+2
  flutter_appauth: 12.1.0

# The SDK's AppAuth 9 constraint compiles against Android 33; this app uses 36.
# Keep this override until the Auth SDK publishes its Android 36 update.
dependency_overrides:
  flutter_appauth: 12.1.0

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  retrofit_generator: ^10.2.11
  json_serializable: ^6.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
  fonts:
    - family: NotoSansKR
      fonts:
        - asset: assets/fonts/NotoSansKR.ttf
